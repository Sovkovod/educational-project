# Запуск сайта одной командой:  docker compose up -d --build
# Открыть:                       http://localhost:8080
services:
  site:
    build:
      context: .
      dockerfile: Dockerfile
    image: volgatop2026-team-site:latest
    container_name: volgatop2026-team-site
    ports:
      # снаружи 8080 → внутри контейнера 80
      - "8080:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      retries: 3
    environment:
      - TZ=Europe/Moscow
